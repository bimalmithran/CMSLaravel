services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ttshoppingcart_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ttshoppingcart
      DB_USERNAME: ttshop_user
      DB_PASSWORD: ttshop_password
      QUEUE_CONNECTION: database
      STOREFRONT_API_KEY: ${STOREFRONT_API_KEY:-your_storefront_api_key_here}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "composer install &&
        php artisan key:generate --force &&
        php artisan storage:link && 
        php artisan migrate --seed --force &&
        apache2-foreground"

  # NEW: Background Queue Worker for Image Compression
  queue_worker:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ttshoppingcart_queue
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ttshoppingcart
      DB_USERNAME: ttshop_user
      DB_PASSWORD: ttshop_password
      QUEUE_CONNECTION: database
      STOREFRONT_API_KEY: ${STOREFRONT_API_KEY:-your_storefront_api_key_here}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "php artisan queue:work --tries=3 --timeout=90"

  mysql:
    image: mysql:8.0
    container_name: ttshoppingcart_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ttshoppingcart
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: ttshop_user
      MYSQL_PASSWORD: ttshop_password
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-hmysql", "-uttshop_user", "-pttshop_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  mysql_data:
    driver: local